[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyarrow-stubs>=17",
    "pyyaml>=6.0",
    "hypothesis>=6.170.14",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["apps/api/src", "apps/api/tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
