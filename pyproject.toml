[tool.uv.workspace]
members = ["apps/api"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.0",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.23",
    "datamodel-code-generator>=0.26",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated by datamodel-code-generator: the header records the full regeneration command on a
# single line, which cannot be wrapped without breaking the drift check.
"apps/api/src/skifer_board/dashboard_spec/models.py" = ["E501"]

[tool.mypy]
strict = true
files = ["apps/api/src", "apps/api/tests"]
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
