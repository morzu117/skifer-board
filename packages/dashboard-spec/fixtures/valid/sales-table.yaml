apiVersion: skifer-board/v1
kind: Dashboard
metadata:
  slug: sales-table
  title: Detail des ventes
spec:
  tiles:
    - id: orders_table
      position: {x: 0, y: 0, w: 12, h: 6}
      query:
        model: sales.orders
        metrics: [revenue, order_count]
        group_by: [order_date, region, channel]
        date_from: "2026-01-01"
        date_to: "2026-03-31"
      viz:
        kind: table
        columns: [order_date, region, channel, revenue, order_count]
