apiVersion: skifer-board/v1
kind: Dashboard
metadata:
  slug: customers-overview
  title: Clients - vue d'ensemble
spec:
  tiles:
    - id: kpi_customers
      position: {x: 0, y: 0, w: 4, h: 3}
      query:
        model: sales.customers
        metrics: [customer_count]
      viz:
        kind: kpi
        metric: customer_count
    - id: customers_table
      position: {x: 4, y: 0, w: 8, h: 4}
      query:
        model: sales.customers
        metrics: [customer_count]
        group_by: [segment, country]
      viz:
        kind: table
        columns: [segment, country, customer_count]
    - id: customers_by_segment
      position: {x: 0, y: 3, w: 4, h: 4}
      query:
        model: sales.customers
        metrics: [customer_count]
        group_by: [segment]
      viz:
        kind: bar
        x: segment
        series: [customer_count]
