apiVersion: skifer-board/v1
kind: Dashboard
metadata:
  slug: structural-viz-kind-pie
  title: Type de viz inconnu
spec:
  tiles:
    - id: revenue_by_month
      position: {x: 0, y: 0, w: 8, h: 4}
      query:
        model: sales.orders
        metrics: [revenue]
        group_by: [order_month]
      viz:
        kind: pie
        x: order_month
        series: [revenue]
