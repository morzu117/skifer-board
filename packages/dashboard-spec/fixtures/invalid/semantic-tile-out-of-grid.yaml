apiVersion: skifer-board/v1
kind: Dashboard
metadata:
  slug: semantic-tile-out-of-grid
  title: Tuile hors grille
spec:
  layout: {columns: 12}
  tiles:
    - id: kpi_revenue
      position: {x: 10, y: 0, w: 4, h: 3}
      query:
        model: sales.orders
        metrics: [revenue]
      viz:
        kind: kpi
        metric: revenue
