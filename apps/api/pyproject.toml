[project]
name = "skifer-board-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "skifer-atlas",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.10",
    "cryptography>=50",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "pg8000>=1.31.6",
]

[project.scripts]
skifer-board-api = "skifer_board.server:main"
skifer-board-migrate = "skifer_board.state.migrate:main"
skifer-board-telemetry = "skifer_board.telemetry.cli:main"
skifer-board-vault-rotate = "skifer_board.execution.rotate:main"

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skifer_board"

# Atlas est lu en bibliothèque, épinglé par commit (plan 04, C2). uv n'applique pas les
# sources d'une dépendance : celle de `skifer`, dépendance d'Atlas, est répétée ici.
[tool.uv.sources]
skifer-atlas = { git = "https://github.com/morzu117/skifer-atlas.git", rev = "fe334267ddbab650824247789e907ccecfee60f0", subdirectory = "core" }
skifer = { git = "https://github.com/morzu117/skifer.git", rev = "v4.0.0" }
