[project]
name = "skifer-board-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
    "skifer-atlas",
    "skifer[analyzer]==4.1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pyjwt[crypto]>=2.10",
    "cryptography>=50",
    "duckdb>=2",
    "sqlalchemy>=2.1.6",
    "alembic>=1.20.1",
    "pg8000>=1.31.6",
]

[project.scripts]
skifer-board-api = "skifer_board.server:main"
skifer-board-migrate = "skifer_board.state.migrate:main"
skifer-board-telemetry = "skifer_board.telemetry.cli:main"
skifer-board-vault-rotate = "skifer_board.execution.rotate:main"

[build-system]
requires = ["uv_build>=0.6"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skifer_board"

# Atlas est lu en bibliothèque, épinglé par commit (plan 04, C2).
# skifer est une dépendance directe, épinglée à la publication PyPI du plan 45.
[tool.uv.sources]
skifer-atlas = { git = "https://github.com/morzu117/skifer-atlas.git", rev = "db9e9df63b6eb8b8b85151ef397c761b5d699bd8", subdirectory = "core" }
