[project]
name = "skifer-board-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "pydantic>=2",
    "httpx>=0.27",
    "fastapi>=0.115",
]

[project.scripts]
skifer-board = "skifer_board.cli:main"

[build-system]
requires = ["uv_build>=0.6,<0.7"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "skifer_board"
