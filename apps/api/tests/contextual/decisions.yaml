# Table de référence T3, plan de développement §4.6.
# Chaque décision est explicite ; le lecteur de tests ne déduit aucune règle métier.
# Jeu au grain (region, mois), sans sous-total. m est remplacé par moyenne pour avg.
# selection = {} : sélection sans filtre ; la portée des parts est celle du dénominateur.
# Regroupements : aucun, mois conservé, mois supprimé, identité au grain complet.
# Les composantes ne sont admissibles que pour avg (contrat MetricRule).
# Un ratio n'est pas un type du contrat actuel ; non_additive représente son refus.
donnees:
  region: [nord, nord, sud, sud]
  mois: [janvier, fevrier, janvier, fevrier]
  m: [10, 20, 30, 40]
  moyenne: [10, 20, 30, 40]
  somme: [10, 60, 60, 160]
  effectif: [1, 3, 2, 4]
# Les sorties sont triées : février avant janvier, nord avant sud.
decisions:
